</style></head><body><main id="game"><div class="environment" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div><header><button class="brand" data-action="home" aria-label="返回开始页">返回</button><div><button id="audio-toggle" aria-label="开启声音" data-action="audio">静音</button><button aria-label="打开设置" data-action="settings">设置</button></div></header><div id="content"></div><div id="love" aria-hidden="true"></div><div id="effect" aria-hidden="true"></div><div id="subtitle" role="status" aria-live="polite"></div><dialog id="modal" aria-labelledby="modal-title"><button class="dismiss" aria-label="关闭窗口" data-action="close">×</button><div id="modal-content"></div></dialog></main><script>window.STORY = {
 title:'',
 prologue:[
 ['旁白','你记得自己只是点了一下「开始游戏」。\n耳机里响起电流声，接着，脚下的地板晃了一下。'],
 ['旁白','眼前是一间商场的休息厅。磨砂玻璃门外，卷帘已经落到一半。手机显示凌晨两点十三分。'],
 ['广播','各位顾客，晚上好。\n本馆已结束营业。尚未离场的顾客，请前往寄存处办理取物手续。'],
 ['旁白','你摘掉耳机。\n广播没有停止。'],
 ['广播','离场路线为：寄存处、候客室、灯廊、模型厅。完成四项核验后，请携取物凭证前往末站。'],
 ['你','有人吗？我不是来买东西的。'],
 ['旁白','服务台空着。半杯茶搁在杯垫上，水面平整，没有热气。墙上的钟和你的手机一样，停在两点十三分。'],
 ['旁白','你拨了家里的号码。没有拨号音。屏幕上只有那款游戏的图标，退出键灰着。'],
 ['广播','请勿逆行穿越卷帘门。若您遗失随身物品，可在末站领取。'],
 ['旁白','卷帘门忽然往下一沉，金属擦过地砖。你从门下缩回手，指节上沾了一层白灰。', {cue:'shutter'}],
 ['你','……先找出口。'],
 ['旁白','地上的指示灯依次亮起。最远的一盏，照着「寄存」两个字。你把手机塞回口袋，沿着灯走过去。']
 ],
 rooms:[
 {name:'01 / 寄存处',title:'闭馆后的柜台',goal:'找出六对相同图案，打开寄存柜。每次翻两张，未配对的翻板会自动盖回。',broadcast:['各位顾客，请核对寄存柜上的图案。','每次可翻开两块翻板。相同图案会保持开启，六组全部核对后，柜门解锁。','取物后请沿白色指示灯前往候客室。'],hints:['记住每张牌的编号，逐对排除。已经配好的牌不会改变。','若记忆与牌面不符，重新确认未配对的牌；配好的牌可以排除。','使用「查看一对」可得到当前牌面中一对相同图案的位置。']},
 {name:'02 / 候客室',title:'窗帘没有拉开',goal:'将 1—8 按顺序排列，空格留在右下角。只能移动与空格相邻的数字。',broadcast:['候客室的通行面板已启用。','请将数字由左至右、由上至下排列。最后一格应保持空白。','完成后请前往灯廊。离场无需等待工作人员到场。'],hints:['目标是第一行 1 2 3，第二行 4 5 6，第三行 7 8 空格。','空格与数字必须共用一条边，不能斜着移动。当前局面仍然可以解开。','使用「提示下一步」可以得到当前局面的下一次正确移动。']},
 {name:'03 / 灯廊',title:'九盏夜灯',goal:'关闭全部九盏灯。每次点击会切换自身及上下左右的灯，边界外不受影响。',broadcast:['请协助关闭本区夜间照明。','开关为十字联动。按下一个开关，会同时切换本灯及上下左右的灯。','全部熄灭后，模型厅的门将开启。如照明自动恢复，可按服务铃申请人工复核。'],hints:['灯灭着时也可以按。重复点击同一位置两次，会回到原状。','先考虑一次点击影响哪些灯，不要只追着亮着的灯点。','使用「提示下一步」，可以得到当前灯光的一步解法。']},
 {name:'04 / 模型厅',title:'通行核验',goal:'把三枚圆环从左柱搬到右柱。先选起点，再选终点，每次只搬顶部一枚，大环不能压小环。',broadcast:['出口核验台已启用。','请将左侧的三枚圆环完整移至右侧。每次移动一枚，不可把较大的圆环放在较小的圆环上。','核验通过后，请领取取物凭证。请勿拆卸展台。'],hints:['三枚圆环至少需要七步。中间柱可以临时放置圆环。','先将最大的圆环移到右边，再把另外两枚叠回上面。','使用「提示下一步」可查看当前局面的下一次移动。']},
 {name:'05 / 理发室',title:'末站',goal:'取物凭证夹在镜框边。镜前只有一把椅子，坐垫是暖的。',broadcast:['末站已开放。您的随身物品已备妥。','完成本次服务后，外门将解除锁定。服务期间如需暂停，请睁眼示意。','感谢您的等候。'],hints:['坐到理发椅上，接着可以选择闭眼。','睁眼会暂停剪发。关闭设置或刷新后，可以从已完成的长度继续。','服务结束后，三个结局都可以选择。调查、提示和错误次数不影响结局。']}
 ],
 enter:[
 [
 ['旁白','寄存处的柜台很低，边角包着发黄的软胶。你弯下腰，才发现翻板藏在台面下方。'],
 ['广播','请核对寄存柜上的图案。相同图案可成对开启。'],
 ['旁白','月亮、星星、钥匙……这些图案印在褪色的塑料上。其中一块被磨得特别光滑，边缘有一道浅浅的牙印。'],
 ['你','怎么像幼儿园里的东西。'],
 ['旁白','柜台边挂着一个小篮子。你拉过来，里面只有一张已经泛黄的电影票。票上的日期是今天，年份却早了很多。'],
 ['广播','六组全部核对后，柜门解锁。\n请带好属于您的物品。'],
 ['旁白','你把票放回原处。柜门缝里透出一点暗红色，闻起来像刚下过雨的泥土。'],
 ['你','先看看能不能打开。']
 ],
 [
 ['旁白','候客室里没有排椅。门后是一张窄床，床脚铺着旧地毯，窗帘上的小星星已经洗得掉了色。'],
 ['旁白','你小时候也有这样一副窗帘。搬家时没带走，后来新房里换成了白色百叶窗。'],
 ['广播','候客室的通行面板已启用。请将数字由左至右、由上至下排列。最后一格应保持空白。'],
 ['旁白','床上放着一只兔子。左耳比右耳短，肚子上缝着一颗不属于它的蓝纽扣。', {prop:'rabbit'}],
 ['你','……这颗纽扣。'],
 ['旁白','你用指甲拨开它肚子上的绒毛。底下那一道歪歪扭扭的针脚，还在。'],
 ['旁白','搬家那天，装玩具的纸箱少了一个。你在车库里找过一下午。大人说到了新家，可以再买一只。'],
 ['你','后来买的，耳朵都不对。'],
 ['旁白','你抱起兔子。它的重量和记忆里一样，棉花稍微有一点结块。背后的开线处换了新线。', {prop:'rabbit',gift:'rabbit'}],
 ['广播','完成核验后，请前往灯廊。离场无需等待工作人员到场。'],
 ['旁白','你试着打开房门。门把手转得动，锁舌却没有缩回。数字面板亮了。']
 ],
 [
 ['旁白','走廊里挂着九盏小灯。奶白色的灯罩下，各有一小块褪色的墙纸。'],
 ['旁白','你经过第一盏时，闻到洗衣粉的味道。第二盏下面是旧木柜的气味。再往前，是夏天晒热的水泥。'],
 ['你','这里到底是什么地方……'],
 ['广播','请协助关闭本区夜间照明。开关采用十字联动，请留意相邻灯光的变化。'],
 ['旁白','走廊另一端的电子钟亮着：02:13。你看了一眼手机，电量一格没少，时间也没有变。'],
 ['旁白','窗外的雨很大。但没有一滴水打在玻璃上。'],
 ['广播','全部照明关闭后，模型厅的门将开启。如照明自动恢复，可按服务铃申请人工复核。'],
 ['你','你听得见我吗？\n现在离早上还有多久？'],
 ['旁白','喇叭里响起短促的提示音，接着恢复安静。你等了一会儿，把手放到开关上。']
 ],
 [
 ['旁白','模型厅比前面几间屋子都小。墙上没有窗，正中间摆着一座建筑模型，外壳还露着没涂完的底色。'],
 ['广播','请将左侧的三枚圆环完整移至右侧。每次移动一枚，不可把较大的圆环放在较小的圆环上。'],
 ['旁白','你绕到展台背面。寄存处、那张窄床、九盏灯，都挤在一块木板上。'],
 ['旁白','候客室的模型床是空的。柜台上没有玫瑰，电影票还放在小篮子里。'],
 ['你','连刚才放回去的位置都一样。'],
 ['旁白','你从口袋里取出玫瑰，放到展台旁。模型地面上，一点暗红色慢慢浮现。'],
 ['旁白','你把花拿走。\n那一点红色也消失了。'],
 ['广播','核验通过后，请领取取物凭证。请勿拆卸展台。'],
 ['旁白','模型的边缘没有街道。走廊之外，木板上留着大片空白。'],
 ['你','出口在哪一边？'],
 ['旁白','右侧圆环柱的底座亮起一小块绿灯。你把玫瑰收回口袋。']
 ],
 [
 ['旁白','末站是一间理发室。玻璃门上贴着营业时间，最后一位数字被反复揭下，留下许多重叠的胶痕。'],
 ['广播','您的随身物品已备妥。完成本次服务后，外门将解除锁定。'],
 ['旁白','兔子被你放在空椅子上。洗手台边有一杯温水，旁边那只小碟子里，是剥好糖纸的橘子糖。'],
 ['你','先把手机还给我，可以吗？'],
 ['旁白','口袋轻了一下。你低头时，手机已经躺在镜前。原来的钥匙也在，钥匙扣上还沾着你出门时碰到的面粉。'],
 ['旁白','你明明一直把它们放在口袋里。'],
 ['广播','服务期间如需暂停，请睁眼示意。\n感谢您的等候。'],
 ['旁白','镜子蒙着深色的布。梳子按大小排好，剪刀的握柄上缠了一层软胶，和寄存柜的边角一样。'],
 ['旁白','收音机忽然接上了一段旧节目。', {cue:'radio'}],
 ['收音机','……说的是旧时候的习俗。亲手替心爱的女子剪一回头发，往后便能白头偕老。'],
 ['旁白','节目播到这里，磁带倒转了半圈。\n「白头偕老。」\n又一遍。'],
 ['你','这句话，你听了多少遍？'],
 ['旁白','播放键弹起来。房间静了。椅子底下，一小簇碎发贴着瓷砖滑过去。'],

window.Puzzles = (() => {
  const adjacent = (a,b) => Math.abs(Math.floor(a/3)-Math.floor(b/3))+Math.abs(a%3-b%3)===1;
  const slide = (board,index) => {const z=board.indexOf(0);if(!adjacent(z,index))return null;const next=board.slice();[next[z],next[index]]=[next[index],next[z]];return next;};
  let distances;
  function slideHint(board){
    if(!distances){distances=new Map([['123456780',0]]);const q=['123456780'];for(let h=0;h<q.length;h++){const key=q[h],a=key.split('').map(Number),z=a.indexOf(0),d=distances.get(key);for(let i=0;i<9;i++){if(!adjacent(i,z))continue;const n=slide(a,i).join('');if(!distances.has(n)){distances.set(n,d+1);q.push(n);}}}}
    const d=distances.get(board.join(''));if(!d)return null;
    return board.findIndex((_,i)=>{const n=slide(board,i);return n&&distances.get(n.join(''))===d-1;});
  }
  function lights(board,index){return board.map((v,i)=>i===index||adjacent(i,index)?!v:v);}
  function lightSolution(board){let best=null;for(let mask=0;mask<512;mask++){let a=board.slice(),moves=[];for(let i=0;i<9;i++)if(mask&(1<<i)){a=lights(a,i);moves.push(i);}if(a.every(v=>!v)&&(!best||moves.length<best.length))best=moves;}return best;}
  function transfer(rods,from,to){if(from===to||!rods[from].length)return null;const disc=rods[from].at(-1);if(rods[to].length&&rods[to].at(-1)<disc)return null;const out=rods.map(r=>r.slice());out[from].pop();out[to].push(disc);return out;}
  function hanoiHint(rods){const key=r=>JSON.stringify(r),q=[{r:rods,path:[]}],seen=new Set([key(rods)]);for(let h=0;h<q.length;h++){const {r,path}=q[h];if(r[2].length===3)return path[0]||null;for(let a=0;a<3;a++)for(let b=0;b<3;b++){const n=transfer(r,a,b);if(n&&!seen.has(key(n))){seen.add(key(n));q.push({r:n,path:[...path,[a,b]]});}}}return null;}
  return {adjacent,slide,slideHint,lights,lightSolution,transfer,hanoiHint};
})();

 if(state.room===3){const move=P.hanoiHint(state.rods);state.hintTarget=move;state.selected=null;text=move?`下一步：把${['左柱','中柱','右柱'][move[0]]}顶部的圆环移到${['左柱','中柱','右柱'][move[1]]}。`:''}
 state.message=text;render();notice(text)}
function cutHair(){stop();state.hairMode='cutting';render();const base=state.hair;for(let n=base+1;n<=3;n++)later(()=>{if(state.hairMode!=='cutting')return;state.hair=n;sound('snip',n%2?-.45:.45);notice(`咔嚓。\n${n===3?'剪刀放下了。只有三厘米。':n===2?'耳边，有一声轻轻的叹息。':'剪刀声暂停了一小会儿。'}`);if(n===2)later(()=>sound('sigh',.2),450);if(n===3){state.hairMode='done';if(!state.solved.includes(4))state.solved.push(4);if(!state.gifts.includes('thread'))state.gifts.push('thread');state.message='桌面传来轻响。剪刀放下了。'}render()},(n-base)*2400)}
function hint(){const r=S.rooms[state.room],i=Math.min(state.hints[state.room]++,2);save();modal('一点提示',`<p class="small">${r.name} · ${i+1}/3 · 不影响结局</p><p class="hint">${esc(r.hints[i])}</p>${i<2?b('再清楚一点','hint'):''}${state.room<4&&!state.solved.includes(state.room)?b(state.room===0?'查看一对':'显示下一步','aid-close'):''}${b('回去试试','close','primary')}`)}
function inventory(){const info={rose:['🌹','玫瑰花'],rabbit:['🐇','兔子玩偶'],thread:['Ⅲ','系着红线的三厘米头发']};modal('随身物品',state?.gifts.length?`<div class="inventory-grid">${state.gifts.map(id=>`<div class="inventory-object" role="img" aria-label="${info[id][1]}"><span aria-hidden="true">${info[id][0]}</span></div>`).join('')}</div>`+b('收好','close','primary'):'<p>口袋还是空的。</p>'+b('回到故事','close','primary'))}
function settingsModal(){modal('歇一小会儿',`${b('声音：'+(settings.sound?'开启':'关闭'),'audio-modal','setting')}${b('场景异常效果：'+(settings.effects?'开启':'关闭'),'effects','setting')}${b('降低动态：'+(settings.reduced?'开启':'关闭'),'reduced','setting')}<p class="small">打开这里会暂停翻牌与剪发。关闭后可继续。所有声音都有文字反馈，静音可以完整游玩。没有人物形象、恐怖突脸或连续闪光。</p>${b('游玩说明','help')}${!home?b('回到开始页，保留进度','home'):''}${b('继续游戏','close','primary')}`)}
function help(){modal('游玩说明','<p>凌晨两点十三分，商场开始播报闭馆通知。沿指示灯完成离场手续，带好随身物品。</p><p>每间房都有广播说明。解谜之外，可以展开「环顾四周」调查物品。对话下方的「上一句」可以回看已经读过的内容；回看不会重置谜题或再次触发场景事件。</p><p>翻牌配对、数字滑块、熄灯、汉诺塔。约 10—15 分钟，可选调查会延长时长。提示、重置和调查次数不限制结局。</p><p>用手指点击即可。电脑也可以用 Tab 与 Enter 操作。空格或右方向键推进对话，左方向键回看。进度保存在当前浏览器，重玩保留结局收藏。</p><p class="small">默认静音，广播以字幕呈现，不使用人物配音。所有音效都有文字反馈。可在设置里关闭异常效果、降低动态。</p>'+b('回到故事','close','primary'))}
function gallery(){modal('三种明天',Object.entries(S.endings).map(([id,e],i)=>`<p class="journal-entry">0${i+1} · ${endings.includes(id)?e.title:'尚未抵达'}<br><span class="small">${endings.includes(id)?e.sub:'那个选择之后的故事，等你亲手走到。'}</span></p>`).join('')+b('回到游戏','close','primary'))}
function start(){if(state)modal('重新开始这段故事？',`<p>当前故事进度会重置，结局收藏会保留。</p>${b('重新开始','new-confirm','primary')}${b('保留进度','close')}`);else newGame()}
function newGame(){stop();close();state=initial();render();window.scrollTo(0,0)}
function end(value){if(!S.endings[value])return;stop();state.ending=value;state.screen='end';if(!endings.includes(value))endings.push(value);write(K+'-endings',endings);render();if(value==='stay')love()}
function act(a,el){switch(a){case'start':case'restart':start();break;case'new-confirm':newGame();break;case'continue':render();break;case'next':next();break;case'prev':prev();break;case'broadcast':broadcast();break;case'inspect-scene':inspectScene(el.dataset.value);break;case'home':titleScreen();break;case'close':close();break;case'inventory':inventory();break;case'hint':hint();break;case'aid':aid();break;case'aid-close':close();aid();break;case'settings':settingsModal();break;case'help':help();break;case'gallery':gallery();break;case'audio':case'audio-modal':settings.sound=!settings.sound;sync();if(settings.sound)sound();else audioCtx?.suspend();if(a==='audio-modal')settingsModal();break;case'effects':settings.effects=!settings.effects;sync();settingsModal();break;case'reduced':settings.reduced=!settings.reduced;sync();settingsModal();break;case'card':card(Number(el.dataset.value));break;case'tile':tile(Number(el.dataset.value));break;case'light':light(Number(el.dataset.value));break;case'rod':rod(Number(el.dataset.value));break;case'reset-puzzle':resetPuzzle();break;case'complete':complete();break;case'ask-light':if(state.room===2&&state.events.includes('relight')&&!state.solved.includes(2)){state.lights=Array(9).fill(false);solved();state.message='服务铃响了一声。\n广播：「照明复核完成，请继续前进。」';render();}break;case'sit':state.hairMode='eyes';state.message='围布的领口，留了不会勒到你的余量。';render();sound('step');break;case'cut-hair':cutHair();break;case'pause-hair':stop();state.message='剪刀声停了。镜布没有动。';render();sound('tick');break;case'end':end(el.dataset.value);break;case'rechoose':stop();state.screen='final';render();break;}}
 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)act(el.dataset.action,el)});
 document.addEventListener('keydown',e=>{if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&!$('modal').open&&!home&&(state.screen==='story'||state.review!==null)){e.preventDefault();e.key==='ArrowLeft'?prev():next();return}if(e.code==='Space'&&!['BUTTON','INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&!$('modal').open&&!home){e.preventDefault();next()}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();audioCtx?.suspend();if(!home&&state?.screen==='room')render()}});
 sync();titleScreen();
})();

</script></body></html>
